[project]
name = "med-checks"
version = "0.1.0"
description = "Backend-сервис проверки записей наблюдений за детьми"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.117",
  "uvicorn[standard]>=0.30,<0.35",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<1.16",
  "psycopg2-binary>=2.9,<2.10",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "python-multipart>=0.0.9,<0.0.20",
  "httpx>=0.27,<0.29",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
